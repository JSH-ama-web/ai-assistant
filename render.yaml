# Render Blueprint (선택) — 대시보드에서 직접 만들 경우 아래 값을 그대로 입력하면 된다.
services:
  - type: web
    name: ai-assistant-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AI_API_KEY
        sync: false        # 코디세이 콘솔 키 — 대시보드에서 직접 입력 (커밋 금지)
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false        # 예: https://your-app.vercel.app
      - key: AI_BASE_URL
        value: https://copa.codyssey.kr
      - key: AI_MODEL
        value: claude-haiku-4
      - key: AI_MAX_TOKENS
        value: "500"
